<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пупсики</title>
<style>
:root{--bg:#0b1430;--fg:#e8eeff;--card:#16234a;--acc:#ff6b5e;--line:#2c3e72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1430;--fg:#e8eeff;--card:#16234a;--acc:#ff6b5e;--line:#2c3e72}}
:root[data-theme="dark"]{--bg:#0b1430;--fg:#e8eeff;--card:#16234a;--acc:#ff6b5e;--line:#2c3e72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100%}
#wrap{position:relative;width:100%;max-width:800px;padding:8px}
canvas{width:100%;display:block;border:3px solid var(--fg);border-radius:10px;background:#000;touch-action:none}
#btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
button{font:inherit;font-weight:700;padding:12px 6px;border:2px solid var(--fg);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
button:disabled{opacity:.45}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#menu{position:absolute;inset:8px;background:color-mix(in srgb,var(--bg) 94%,transparent);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:14px;text-align:center;overflow:auto}
#menu h1{margin:0;font-size:clamp(28px,7vw,48px);letter-spacing:.5px}
#menu p{margin:0;max-width:52ch;line-height:1.4}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:205px;text-align:left;padding:10px;background:var(--card);border:2px solid var(--fg);border-radius:10px;font-size:13px;line-height:1.3;font-weight:400}
#splash{position:absolute;inset:0;z-index:5;background:rgba(4,8,22,.85);display:flex;align-items:center;justify-content:center;padding:14px}
#splash .box{background:var(--card);border:3px solid var(--acc);border-radius:6px;padding:24px 32px;text-align:center;box-shadow:6px 6px 0 var(--acc);font-family:'Courier New',monospace}
#splash h2{margin:6px 0 14px;font-size:clamp(26px,7vw,42px);letter-spacing:2px}
.card b{font-size:18px;display:block}
.hide{display:none!important}
small{opacity:.75}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="800" height="500"></canvas>
  <div id="btns">
    <button id="bHit">👊 Удар</button>
    <button id="bSay">🗣 Фраза</button>
    <button id="bKit">💊 Аптечка</button>
  </div>
  <div id="splash"><div class="box"><div>🪳 проект 🪳</div><h2>Kirill-Pixel</h2><button id="go">Начать</button></div></div>
  <div id="menu">
    <h1>Пупсики</h1>
    <p id="msg">Дина позвала всех к себе. Всё шло отлично, пока из-под плиты не полезли огромные тараканы. Выбери, кем драться.</p>
    <div class="cards" id="cards"></div>
    <small>Двигаться: WASD / стрелки или тап по полю. Удар: Пробел. Фраза: Q. Аптечка: E (перезарядка 40 сек).</small>
  </div>
</div>
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=800,H=500;
const CH={
 kirill:{name:'Кирилл',phrase:'Я хочу угорать',kit:'Молоко',ke:'🥛',heal:30,shirt:'#d62f3a',pants:'#1a1a1f',hair:'#a97c50',hl:'#c4955f',eye:'#4a2f1a',glasses:true,collar:true,style:'short',look:'очки, русые волосы, чёрные джинсы, красная рубашка',info:'Фраза: тараканы замирают на 3 сек. Молоко: +30 HP, снимает яд.'},
 dina:{name:'Дина',phrase:'Где мой авторский стиль',kit:'Вино',ke:'🍷',heal:45,shirt:'#17171c',pants:'#3b4f86',hair:'#f2d36b',hl:'#fbe9a0',eye:'#3d7fb5',long:true,style:'long',look:'блондинка, чёрная футболка',info:'Фраза: следующий удар x2. Вино: +45 HP, но 6 сек можно промахнуться.'},
 baha:{name:'Баха',phrase:'Кальян вкусный спору нет, но где он был 8 лет',kit:'Кальян',ke:'💨',heal:35,shirt:'#8b8f96',pants:'#2b2f3a',hair:'#15151a',hl:'#3a3a44',eye:'#2a1a10',style:'bun',look:'чёрные волосы пучком, серая футболка',info:'Фраза: дымовая завеса, тараканы замирают на 2,5 сек. Кальян: +35 HP и дым на 2 сек.'},
 ruslan:{name:'Руслан',phrase:'Я тебе туз порву',kit:'Силовые',ke:'💪',heal:40,shirt:'#111114',pants:'#2f3a52',hair:'#b08a5a',hl:'#c9a574',eye:'#3a2a1a',style:'buzz',bw:1.3,look:'короткие русые волосы, чёрная футболка, качок',info:'Фраза: ударная волна (20 урона вокруг) и удар x2. Силовые: +40 HP и удар x2.'},
 misha:{name:'Миша',phrase:'Где мое китайское пиво',kit:'Пиво',ke:'🍺',heal:40,shirt:'#e0752a',pants:'#33405e',hair:'#a97c50',hl:'#c4955f',eye:'#4a2f1a',style:'med',look:'русые волосы, рыжая толстовка',info:'Фраза: +15 HP. Пиво: +40 HP, но 4 сек можно промахнуться.'},
 anya:{name:'Аня',phrase:'Где мой арбалет',kit:'Аниме',ke:'📺',heal:30,shirt:'#f4f4f4',pants:'#3b4f86',hair:'#f2d36b',hl:'#fbe9a0',eye:'#3d7fb5',style:'anya',look:'блондинка, собранные волосы, белая футболка',info:'Фраза: арбалетный болт, 45 урона ближайшему. Аниме: +30 HP и сброс перезарядки фразы.'}
};
const CHEERS=['Они портят нам тусу, убей их!','Бей тараканов!','Ты можешь, давай!','Раздави их!','Не сдавайся!','Вот это удар!'];
const TYPES={
 small:{hp:30,sp:58,dmg:6,r:15,col:'#6b3f1d',pz:.15},
 big:{hp:65,sp:50,dmg:10,r:24,col:'#4a2a12',pz:.25},
 queen:{hp:220,sp:40,dmg:15,r:40,col:'#2a1608',pz:.35}
};
const WAVES=[{t:'small',n:4},{t:'big',n:3},{t:'queen',n:1}];
const KIT_CD=40,SAY_CD=8,HIT_CD=.45;
let S=null,keys={},ptr=null,last=0;

const cards=document.getElementById('cards');
for(const k in CH){const c=CH[k],d=document.createElement('button');d.className='card';
 d.innerHTML=`<b>${c.name}</b>«${c.phrase}»<br><small>${c.look}</small><br>${c.info}`;
 d.onclick=()=>start(k);cards.appendChild(d);}

function start(k){
 S={key:k,ch:CH[k],p:{x:400,y:300,hp:100,face:1,sw:0},roaches:[],wave:-1,atk:0,say:0,kit:0,
    dbl:false,miss:0,poison:0,stun:0,fl:[],bubble:null,banner:null,over:false,spawnT:0,t:0,anim:null,bolt:null,gb:null,chatT:1.2,chatI:0,chatN:0,guests:Object.keys(CH).filter(q=>q!==k)};
 document.getElementById('menu').classList.add('hide');
 nextWave();
}
function nextWave(){
 S.wave++;
 if(S.wave>=WAVES.length){return end(true);}
 const w=WAVES[S.wave];
 S.banner={txt:`Волна ${S.wave+1}/${WAVES.length}`,t:2};
 for(let i=0;i<w.n;i++)spawn(w.t);
}
function spawn(t,x,y){
 const T=TYPES[t];
 if(x===undefined){const side=Math.random()<.5;x=side?(Math.random()<.5?125:W-125):130+Math.random()*(W-260);y=side?100+Math.random()*350:(Math.random()<.5?90:H-30);}
 S.roaches.push({t,x,y,hp:T.hp,max:T.hp,cd:0,a:0,...T});
}
function end(win){
 S.over=true;
 document.getElementById('msg').textContent=win?'Победа! Квартира очищена, Дина достаёт торт.':'Тараканы победили. Дина прячется на балконе.';
 document.getElementById('menu').classList.remove('hide');
}
function float(x,y,txt,col){S.fl.push({x,y,txt,col,t:1.2});}

function attack(){
 if(!S||S.over||S.atk>0)return;
 S.atk=HIT_CD;S.p.sw=.2;
 const reach=S.dbl?95:70,dmg=S.dbl?30:15;
 let hit=false;
 if(S.miss>0&&Math.random()<.4){float(S.p.x,S.p.y-50,'мимо!','#e8c9ff');S.dbl=false;return;}
 for(const r of S.roaches){
  if(Math.hypot(r.x-S.p.x,r.y-S.p.y)<reach+r.r){
   r.hp-=dmg;hit=true;
   const a=Math.atan2(r.y-S.p.y,r.x-S.p.x);r.x+=Math.cos(a)*18;r.y+=Math.sin(a)*18;
   float(r.x,r.y-r.r-10,'-'+dmg,'#ffd24a');
  }
 }
 if(hit)S.dbl=false;
 S.roaches=S.roaches.filter(r=>r.hp>0);
 if(!S.roaches.length&&S.wave<WAVES.length&&!S.pending){
  S.pending=true;
  if(S.wave+1>=WAVES.length){end(true);}
  else{S.banner={txt:'Тараканы повержены... но лезут новые!',t:1.8};setTimeout(()=>{if(S&&!S.over){S.pending=false;nextWave();}},1800);}
 }
}
function afterKill(){
 S.roaches=S.roaches.filter(r=>r.hp>0);
 if(!S.roaches.length&&!S.pending){S.pending=true;
  if(S.wave+1>=WAVES.length)end(true);
  else{S.banner={txt:'Тараканы повержены... но лезут новые!',t:1.8};setTimeout(()=>{if(S&&!S.over){S.pending=false;nextWave();}},1800);}}
}
function phrase(){
 if(!S||S.over||S.say>0)return;
 S.say=SAY_CD;S.bubble={txt:'«'+S.ch.phrase+'!»',t:2.5};
 const k=S.key,p=S.p;
 if(k==='kirill')S.stun=3;
 else if(k==='baha')S.stun=2.5;
 else if(k==='dina')S.dbl=true;
 else if(k==='ruslan'){S.dbl=true;for(const r of S.roaches)if(Math.hypot(r.x-p.x,r.y-p.y)<130){r.hp-=20;float(r.x,r.y-r.r-10,'-20','#ffd24a');}afterKill();}
 else if(k==='misha'){p.hp=Math.min(100,p.hp+15);float(p.x,p.y-55,'+15','#6be08a');}
 else if(k==='anya'){let n=null,dm=1e9;for(const r of S.roaches){const d=Math.hypot(r.x-p.x,r.y-p.y);if(d<dm){dm=d;n=r;}}
  if(n){n.hp-=45;float(n.x,n.y-n.r-10,'-45','#ffd24a');S.bolt={x0:p.x,y0:p.y-10,x1:n.x,y1:n.y,t:.25};}afterKill();}
}
function medkit(){
 if(!S||S.over||S.kit>0)return;
 const c=S.ch;S.kit=KIT_CD;S.anim={t:0,d:1.6};
 S.p.hp=Math.min(100,S.p.hp+c.heal);float(S.p.x,S.p.y-55,'+'+c.heal,'#6be08a');
 ({kirill(){S.poison=0},dina(){S.miss=6},baha(){S.stun=2},ruslan(){S.dbl=true},misha(){S.miss=4},anya(){S.say=0}})[S.key]();
}
document.getElementById('bHit').onclick=attack;
document.getElementById('bSay').onclick=phrase;
document.getElementById('bKit').onclick=medkit;
addEventListener('keydown',e=>{
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
 keys[e.key.toLowerCase()]=true;
 if(e.key===' ')attack();
 if(e.key.toLowerCase()==='q'||e.key.toLowerCase()==='й')phrase();
 if(e.key.toLowerCase()==='e'||e.key.toLowerCase()==='у')medkit();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function setPtr(e){const r=cv.getBoundingClientRect();ptr={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{setPtr(e);cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(ptr)setPtr(e);});
cv.addEventListener('pointerup',()=>ptr=null);
cv.addEventListener('pointercancel',()=>ptr=null);

function update(dt){
 if(!S||S.over)return;
 const p=S.p;
 S.t+=dt;
 for(const k of['atk','say','kit','miss','poison','stun'])S[k]=Math.max(0,S[k]-dt);
 if(p.sw>0)p.sw-=dt;
 let dx=0,dy=0;
 if(keys['a']||keys['arrowleft']||keys['ф'])dx--;
 if(keys['d']||keys['arrowright']||keys['в'])dx++;
 if(keys['w']||keys['arrowup']||keys['ц'])dy--;
 if(keys['s']||keys['arrowdown']||keys['ы'])dy++;
 if(!dx&&!dy&&ptr){const ex=ptr.x-p.x,ey=ptr.y-p.y,d=Math.hypot(ex,ey);if(d>8){dx=ex/d;dy=ey/d;}}
 const m=Math.hypot(dx,dy)||1;
 p.x=Math.max(120,Math.min(W-120,p.x+dx/m*150*dt));
 p.y=Math.max(100,Math.min(H-30,p.y+dy/m*150*dt));
 if(dx)p.face=dx>0?1:-1;
 p.mv=!!(dx||dy);
 if(S.poison>0){p.hp-=3*dt;}
 for(const r of S.roaches){
  r.cd-=dt;
  const ex=p.x-r.x,ey=p.y-r.y,d=Math.hypot(ex,ey);
  r.a=Math.atan2(ey,ex);
  if(S.stun>0)continue;
  if(d>r.r+14){r.x+=ex/d*r.sp*dt;r.y+=ey/d*r.sp*dt;}
  else if(r.cd<=0){
   r.cd=.9;p.hp-=r.dmg;float(p.x,p.y-50,'-'+r.dmg,'#ff6b5e');
   if(Math.random()<r.pz)S.poison=4;
  }
 }
 if(S.wave===2&&S.roaches.some(r=>r.t==='queen')){
  S.spawnT+=dt;
  if(S.spawnT>6&&S.roaches.length<8){S.spawnT=0;const q=S.roaches.find(r=>r.t==='queen');spawn('small',q.x,q.y);}
 }
 for(const f of S.fl){f.t-=dt;f.y-=25*dt;}
 S.fl=S.fl.filter(f=>f.t>0);
 if(S.bubble){S.bubble.t-=dt;if(S.bubble.t<=0)S.bubble=null;}
 if(S.anim){S.anim.t+=dt;if(S.anim.t>=S.anim.d)S.anim=null;}
 if(S.bolt){S.bolt.t-=dt;if(S.bolt.t<=0)S.bolt=null;}
 if(S.gb){S.gb.t-=dt;if(S.gb.t<=0)S.gb=null;}
 S.chatT-=dt;
 if(S.chatT<=0&&S.guests.length){S.chatT=3.6;const i=S.chatI++%S.guests.length,g=CH[S.guests[i]];
  S.gb={i,t:3.2,txt:(S.chatN++%2===0)?CHEERS[Math.floor(Math.random()*CHEERS.length)]:'«'+g.phrase+'!»'};}
 if(S.banner){S.banner.t-=dt;if(S.banner.t<=0)S.banner=null;}
 if(p.hp<=0){p.hp=0;end(false);}
}

const room=document.createElement('canvas'),vig=document.createElement('canvas');
room.width=vig.width=W;room.height=vig.height=H;

function lg(c,x0,y0,x1,y1,a,b){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function rg(c,x,y,r0,r1,a,b){const g=c.createRadialGradient(x,y,r0,x,y,r1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}

   c.strokeStyle='rgba(50,28,12,.12)';c.lineWidth=1;
   for(let i=0;i<4;i++){const yy=y+4+rnd()*18;c.beginPath();c.moveTo(x+4,yy);c.bezierCurveTo(x+len*.3,yy+rnd()*4-2,x+len*.6,yy+rnd()*4-2,x+len-4,yy);c.stroke();}
   c.strokeStyle='rgba(4,8,28,.65)';c.lineWidth=1.5;c.strokeRect(x,y,len,26);
   x+=len;}}
 c.fillStyle=lg(c,0,72,W,H,'rgba(255,245,215,.18)','rgba(0,0,0,.12)');c.fillRect(0,72,W,H-72);
 c.fillStyle='rgba(255,246,210,.16)';c.beginPath();c.moveTo(90,72);c.lineTo(200,72);c.lineTo(330,330);c.lineTo(170,330);c.fill();
 c.fillStyle=lg(c,0,64,0,78,'#f0e8da','#a89880');c.fillRect(0,64,W,12);

 c.strokeStyle='#f6f1e8';c.lineWidth=6;c.strokeRect(90,10,110,48);c.lineWidth=4;c.beginPath();c.moveTo(145,10);c.lineTo(145,58);c.stroke();

 c.strokeStyle='#8c9298';c.lineWidth=2;c.stroke();c.beginPath();c.moveTo(660,30);c.lineTo(752,30);c.stroke();
 c.fillStyle='#7d838a';c.fillRect(738,12,5,14);c.fillRect(738,38,5,26);
 c.fillStyle='rgba(0,0,0,.25)';c.fillRect(478,70,108,10);
 c.fillStyle=lg(c,0,10,0,70,'#4a4a4e','#26262a');rr(c,480,10,104,60,4);c.fill();
 for(let i=0;i<4;i++){c.fillStyle='#111';c.beginPath();c.arc(502+(i%2)*46,28+(i>>1)*26,10,0,7);c.fill();c.strokeStyle='#555';c.lineWidth=2;c.stroke();}
 c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=14;c.shadowOffsetY=6;
 c.fillStyle='#8f2d35';c.beginPath();c.ellipse(400,295,200,112,0,0,7);c.fill();c.restore();
 c.strokeStyle='#d9b87a';c.lineWidth=3;c.beginPath();c.ellipse(400,295,184,98,0,0,7);c.stroke();
 c.strokeStyle='rgba(217,184,122,.5)';c.lineWidth=1.5;for(let i=1;i<4;i++){c.beginPath();c.ellipse(400,295,184-i*34,98-i*18,0,0,7);c.stroke();}
 c.save();c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=16;c.shadowOffsetY=8;
 c.fillStyle=lg(c,0,360,0,470,'#6d7f9c','#46566f');rr(c,18,364,160,102,14);c.fill();c.restore();
 c.fillStyle=lg(c,0,364,0,392,'#7d90ae','#5a6c88');rr(c,18,364,160,28,12);c.fill();
 for(let i=0;i<2;i++){c.fillStyle=lg(c,0,396,0,452,'#7a8dab','#566882');rr(c,30+i*72,398,68,54,10);c.fill();c.strokeStyle='rgba(20,30,50,.35)';c.lineWidth=1.5;c.stroke();}
 c.save();c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=12;c.shadowOffsetY=7;
 c.fillStyle=lg(c,640,380,750,450,'#8a5d38','#5e3b20');rr(c,640,384,112,68,8);c.fill();c.restore();
 c.fillStyle='#b5532f';c.beginPath();c.ellipse(696,408,14,8,0,0,7);c.fill();
 for(let i=0;i<7;i++){const a=i*.9;c.fillStyle=i%2?'#2f7a3a':'#3f9a4a';c.beginPath();c.ellipse(696+Math.cos(a)*12,402+Math.sin(a)*8,11,5,a,0,7);c.fill();}
 for(const sd of[0,1]){const x0=sd?705:0,w=95;c.fillStyle=lg(c,sd?x0:x0+w,0,sd?x0+w:x0,0,'rgba(5,8,25,.5)','rgba(5,8,25,.88)');c.fillRect(x0,72,w,H-72);c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=3;for(let i=0;i<5;i++){c.beginPath();c.moveTo(x0+i*20,72);c.lineTo(x0+i*20,H);c.stroke();}c.fillStyle='#d9b45a';c.fillRect(sd?705:w-3,72,3,H-72);}

function drawBubble(txt,x,by,maxw){
 ctx.font='bold 13px sans-serif';const words=txt.split(' '),lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxw&&cur){lines.push(cur);cur=w;}else cur=t;}
 lines.push(cur);
 const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+14,h=lines.length*16+8,bx=Math.max(4,Math.min(W-w-4,x-w/2)),top=Math.max(4,by-h);

}

 S.guests.forEach((k,i)=>{const [gx,gy]=gpos(i),jump=S.gb&&S.gb.i===i?-Math.abs(Math.sin(S.t*12))*4:0;

  ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(CH[k].name,gx,gy+46);ctx.textAlign='left';});

  for(let i=0;i<6;i++){const q=(u*2+i/6)%1;ctx.fillStyle=`rgba(230,230,240,${.55*(1-q)*(e>.3?1:0)})`;ctx.beginPath();ctx.arc(x+6+Math.sin(q*6+i)*8+q*10,y-28-q*38,4+q*8,0,7);ctx.fill();}}

 ctx.restore();

document.getElementById('go').onclick=()=>document.getElementById('splash').classList.add('hide');
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 update(dt);
 ctx.clearRect(0,0,W,H);
 if(S){
  drawRoom();drawGuests();
  const list=[...S.roaches.map(r=>({y:r.y,f:()=>drawRoach(r)})),{y:S.p.y,f:drawPlayer}].sort((a,b)=>a.y-b.y);
  list.forEach(o=>o.f());
  drawFX();drawGuestBubble();drawHUD();updateButtons();
  cv.style.filter=S.miss>0?'blur(1.5px)':'none';
 }else{drawRoom();}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
